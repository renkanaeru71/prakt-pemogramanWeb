<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="proses.php" method="post">
        <label for="name">name:</label>
        <input type="text" id="username" name="username" placeholder="Enter your name" required><br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" placeholder="Enter your password" required><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Enter your email" required><br><br>

        <label for="usia">Usia:</label>
        <input type="number" id="usia" name="usia" placeholder="Enter your usia" required min="0" max="120"><br><br>

        <label for="gender">Gender:</label>
        <input type="radio" id="male" name="gender" value="male" required>
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="female" required>
        <label for="female">Female</label>

        <br><br>

        <label for="hobi">Hobi:</label><br>
        <input type="checkbox" name="hobi1" value="membaca"> baca<br>
        <input type="checkbox" name="hobi2" value="menulis"> menulis<br>
        <input type="checkbox" name="hobi3" value="berenang"> berenang<br>
        <input type="checkbox" name="hobi4" value="bermain"> bermain<br>
<br>
        <label for="kota">Kota:</label>
        <select name="kota" id="kota" required>
            <option value="">Pilih kota</option>
            <option value="jakarta">Jakarta</option>
            <option value="bandung">Bandung</option>
            <option value="surabaya">Surabaya</option>
            <option value="yogyakarta">Yogyakarta</option>
        </select>
<br><br>
        <label for="alamat">Alamat</label><br>
        <textarea name="alamat" id="alamat" cols="30" rows="10" placeholder="Enter your alamat" required></textarea>

<br><br>
        <input type="submit" value="Submit">
        
    </form>
</body>
</html>
