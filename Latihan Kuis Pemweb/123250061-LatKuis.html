<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link href="https://cdn.jsdelivr.net/style.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #a0d8a0;
            min-height: 100vh;
        }
        .header-bg {
            background-color: darkgreen;
            color: white;
            padding: 15px 20px;
        }
        .header-content {
            display: flex;
            align-items: center;
        }
        pre {
            margin: 0;
            color: rgb(255, 255, 255);
            font-size: x-large;
            
        }
        .card-custom {
            width: 100%;
            max-width: 500px;
            border-radius: 8px;
        }
    </style>
</head>
<body class="d-flex flex-column">

    <header class="header-bg">
        <div class="header-content">
            <img src="logo.png" alt="Logo Learnify" width="40" class="me-2">
            <pre><b>Learnify</b> <small style="font-size: 0.8rem; opacity: 0.8;">Learn Today, learn Tommorow</small></pre>
        </div>
    </header>

    <main class="flex-grow-1 d-flex align-items-center justify-content-center p-3">
        <div class="card card-custom shadow-sm p-4 bg-white">
            <h5 class="text-center mb-4 fw-bold">Student Information</h5>
            
            <table class="table table-borderless">
                <tbody>
                    <tr>
                        <td style="width: 25%;">Name</td>
                        <td style="width: 5%;">:</td>
                        <td id="nama">Rizky Pratama</td>
                    </tr>
                    <tr>
                        <td>Student ID</td>
                        <td>:</td>
                        <td id="nim">123250061</td>
                    </tr>
                    <tr>
                        <td>Class</td>
                        <td>:</td>
                        <td id="kelas">IF-B</td>
                    </tr>
                </tbody>
            </table>

            <div class="d-flex justify-content-end mt-3">
               <button onclick="Editdata()" class="btn btn-success">Edit Data</button>
            </div>
        </div>
    </main>

    <script>
        function Editdata() {
            let nama = prompt("Masukkan nama")
            let nim = prompt("Berapa nim kamu")
            let kelas = prompt("Kamu kelas apa?")

            document.getElementById("nama").textContent = nama
            document.getElementById("nim").textContent = nim
            document.getElementById("kelas").textContent = kelas

            alert("Update Data Successfully")
        }
    </script>

</body>
</html>
